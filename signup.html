<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Denso</title>
    <link rel="stylesheet" href="SignUp.css">
</head>
<body>

<div id="signupPage-wrapper">
    <div class="background-content"></div>

    <div class="sky-white-edge"></div>
    <div class="sky-overlay"></div>

    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
        <filter id="rough-edge">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />
        </filter>
        
        <defs>
            <path id="cloud-path" d="M25,60 C15,60 10,50 15,40 C10,30 20,20 30,25 C35,15 50,15 55,25 C65,20 75,30 70,40 C75,50 70,60 60,60 Z" />
        </defs>
    </svg>

    <svg class="cloud cloud-1" viewBox="0 0 100 100"><use href="#cloud-path"/></svg>
    <svg class="cloud cloud-2" viewBox="0 0 100 100"><use href="#cloud-path"/></svg>
    <svg class="cloud cloud-3" viewBox="0 0 100 100"><use href="#cloud-path"/></svg>
    <svg class="cloud cloud-4" viewBox="0 0 100 100"><use href="#cloud-path"/></svg>
    <svg class="cloud cloud-5" viewBox="0 0 100 100"><use href="#cloud-path"/></svg>

    <img src="img/Airplane.svg" class="airplane" alt="Airplane">

    <div class="signup-card"> 
        <div class="brand">DENSO</div>
        <h2 class="main-title">Create an account</h2>
        <p class="subtitle">Please use your company email!</p>
        <form>
            <div class="input-group">
                <label>User</label>
                <input type="text" placeholder="Your name" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="email@company.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-blue">Sign Up</button>
            <p style="margin-top: 20px; font-size: 14px; text-align: center;">
                Already have an account? <a href="index.html" style="color: #4361ee; font-weight: bold; text-decoration: none;">Login</a>
            </p>
        </form>
    </div> 
    </div> 
</div> 
</body>
</html>
