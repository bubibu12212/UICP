<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HS Code System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="header-section">
                <h1 class="brand-logo">DENSO</h1>
                <h2 class="main-title">Artificial Intelligence Driving Results For The finding HS Code</h2>
                <p class="subtitle">Welcome back! Please login to your account.</p>
            </div>

            <form>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Remember Me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-login">Login</button>
                    <button type="button" class="btn btn-signup">Sign Up</button>
                </div>
            </form>
        </div>

        <div class="login-right">
            <div class="overlay-image">
                <img src="https://via.placeholder.com/600x800" alt="Logistics Illustration">
            </div>
        </div>
    </div>
</body>
</html>
